# Netlify serves the static export: `npm run build:static` → `out/`.
#
# There is no Next.js runtime here on purpose — no `@netlify/plugin-nextjs`, no
# server functions, no database. Every page is a file, so the deploy is the same
# bytes you get from `npm run preview` locally and from the GitHub Pages workflow.
#
# Set the public address in the Netlify UI (Site configuration → Environment
# variables) before the first deploy; `build:static` bakes it into canonical
# URLs, `sitemap.xml` and `robots.txt`:
#
#   NEXT_PUBLIC_SITE_URL = https://your-site.netlify.app
#
# A site served from a sub-path (GitHub Pages project sites) additionally needs
# NEXT_PUBLIC_BASE_PATH=/<repo>. Leaving it unset serves from the domain root.

[build]
  command = "npm run build:static"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"
  # Deterministic builds: `next build` and `drizzle`-free, so nothing else is
  # required at build time.
  NEXT_TELEMETRY_DISABLED = "1"

# Fingerprinted bundles never change under the same name; everything else must
# revalidate so a new deploy is visible immediately.
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/gltfs/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The service worker must never be cached, or an old shell keeps serving the
# previous build's files after a deploy.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, max-age=0"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# The export writes `works/<slug>/index.html`; `<slug>/` resolves on its own,
# but the extensionless form (shared links, old bookmarks) gets redirected
# instead of 404-ing. Netlify serves `404.html` for everything else.
[[redirects]]
  from = "/works/:id"
  to = "/works/:id/"
  status = 301
  force = false
