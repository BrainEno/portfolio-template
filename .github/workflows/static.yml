name: Static site → GitHub Pages

# Two jobs, one rule: nothing gets published that has not been served and
# crawled locally first.
#
#  verify — every push and every PR: typecheck, lint, then the export is built
#           **twice** and smoke-tested both ways:
#             · at the domain root (custom domain / Netlify / OSS / nginx)
#             · mounted at /<repo>/ (a Pages *project* site, where a missing
#               base-path prefix 404s every image while the JS still loads)
#           The sub-path run is the one that would have shipped broken.
#  build/deploy — pushes to main only, publishes the same export to Pages.
#
# Nothing here talks to a database: the build reads `content/defaults.ts` or the
# committed `content/published.json` snapshot.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Project sites live at /<repo>/. A user site (BrainEno.github.io) or a custom
  # domain is served from the root and needs this cleared — everything else in
  # the build follows from it.
  NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}
  NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build (domain root)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://example.com
        run: npm run build:static
      - name: Smoke-test (domain root)
        env:
          NEXT_PUBLIC_BASE_PATH: ""
        run: npm run smoke
      - name: Build (project site sub-path)
        run: npm run build:static
      - name: Smoke-test (project site sub-path)
        run: npm run smoke

  build:
    needs: verify
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build:static
      # Pages needs a .nojekyll marker, or files/directories starting with an
      # underscore (`_next/`) are dropped from the published output.
      - run: touch out/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
